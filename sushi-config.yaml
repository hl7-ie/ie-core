# ╭──────────────────────────────────────ImplementationGuide───────────────────────────────────────╮
# │  Ireland (IE) Core FHIR Implementation Guide                                                  │
# │  Based on FHIR R4 (4.0.1)                                                                     │
# │  Canonical URL: https://hl7-ie.github.io/ie-core/fhir/ie/core                   │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
id: nostalgic-ie.fhir.core
canonical: https://hl7-ie.github.io/ie-core/fhir/ie/core
name: IECore
title: "IE (Ireland) Core Implementation Guide"
description: >-
  **⚠️ Proof of Concept (PoC):** This Implementation Guide is built as a Proof of Concept by Nithin Mohan.
  It has no support from the HSE, HSE Standards team, or Department of Health.
  In future, this may be handed over to a governing body within Ireland for maintaining this implementation guide.
  This IG is the author's proof of concept to demonstrate how FHIR adoption should be implemented at the national level.
  It is built with the author's experiences working in HL7 V2, V3 CDA, and FHIR, and a curiosity to solve problems for EHDS
  cross-border healthcare from the context of Ireland's healthcare landscape.
  
  The IE Core Implementation Guide is based on FHIR Version R4 and defines the minimum constraints on FHIR resources 
  to create the IE Core Profiles. It also documents the minimum FHIR RESTful interactions for each IE Core Profile to 
  access patient data. IE Core profiles derive from the HL7 Europe Base and Core profiles to ensure conformance
  with the European Health Data Space (EHDS) and cross-border interoperability via the International Patient Summary (IPS) standard.
status: draft
version: 0.2.0
fhirVersion: 4.0.1
copyrightYear: 2025+
releaseLabel: Nostalgic IE (draft)
license: CC-BY-4.0
jurisdiction: urn:iso:std:iso:3166#IE "Ireland"
publisher:
  name: Nithin Mohan T K (Proof of Concept)
  url: https://github.com/hl7-ie
  email: nithinmohantk1@gmail.com

dependencies:
  hl7.fhir.uv.extensions.r4: 5.1.0
  # SUSHI cross-version support: resolves R5 extensions (e.g. extension-MedicationDispense.recorded) used by HL7 Europe MPD
  hl7.fhir.extensions.r5: 4.0.1
  hl7.fhir.eu.base:
    id: hl7fhireubase
    uri: http://hl7.eu/fhir/base/ImplementationGuide/hl7.fhir.eu.base
    version: 2.0.0
  # IPS STU2 / Edition 2 (published Oct 2025)
  hl7.fhir.uv.ips:
    id: hl7fhiruvips
    uri: http://hl7.org/fhir/uv/ips/ImplementationGuide/hl7.fhir.uv.ips
    version: 2.0.0
  hl7.fhir.eu.laboratory:
    id: hl7fhireulab
    uri: http://hl7.eu/fhir/laboratory/ImplementationGuide/hl7.fhir.eu.laboratory
    version: 2.0.0
  # HL7 Europe Extensions 1.3.0, R4 variant (the base package is FHIR R5; an R4 IG must use the .r4 package)
  hl7.fhir.eu.extensions.r4:
    id: hl7fhireuextr4
    uri: http://hl7.eu/fhir/extensions/ImplementationGuide/hl7.fhir.eu.extensions.r4
    version: 1.3.0
  # SMART App Launch 2.2.0: referenced by the SMART on FHIR page (links resolve only for declared dependencies)
  hl7.fhir.uv.smart-app-launch:
    id: hl7fhiruvsmart
    uri: http://hl7.org/fhir/smart-app-launch/ImplementationGuide/hl7.fhir.uv.smart-app-launch
    version: 2.2.0
  # HL7 Europe MPD – ePrescription & eDispensation (published v1.0.0, Jun 2026)
  hl7.fhir.eu.mpd:
    id: hl7fhireuropempd
    uri: http://hl7.eu/fhir/mpd/ImplementationGuide/hl7.fhir.eu.mpd
    version: 1.0.0
  # IHE Pharmacy MPD (R4): already a transitive dependency of hl7.fhir.eu.mpd 1.0.0. Declared explicitly
  # so SUSHI can resolve the IHE medication extensions reused for HIQA EP Section 4 (ADR-003).
  ihe.pharm.mpd.r4:
    id: ihepharmmpdr4
    uri: https://profiles.ihe.net/PHARM/MPD/ImplementationGuide/ihe.pharm.mpd
    version: 1.0.0-comment-2
  # HL7 Europe Patient Summary (EPS) 1.0.0-ballot: parent of the IE Patient Summary (ADR-004).
  # Ballot dependency, pinned; fallback is IPS 2.0.x if EPS has not reached STU.
  hl7.fhir.eu.eps:
    id: hl7fhireueps
    uri: http://hl7.eu/fhir/eps/ImplementationGuide/hl7.fhir.eu.eps
    version: 1.0.0-ballot
  # HL7 Europe Hospital Discharge Report (published 0.1.0-ballot)
  hl7.fhir.eu.hdr:
    id: hl7fhireuropehdr
    uri: http://hl7.eu/fhir/hdr/ImplementationGuide/hl7.fhir.eu.hdr
    version: 0.1.0-ballot
  # HL7 Europe Imaging IG (Ballot 1.0.0, Jun 2026)
  hl7.fhir.eu.imaging:
    id: hl7fhireuimaging
    uri: http://hl7.eu/fhir/imaging/ImplementationGuide/hl7.fhir.eu.imaging
    version: 1.0.0-ballot
  # HL7 Europe Health Data API (Ballot 1.0.0, Jun 2026)
  hl7.fhir.eu.health-data-api:
    id: hl7fhireuhealthdataapi
    uri: http://hl7.eu/fhir/health-data-api/ImplementationGuide/hl7.fhir.eu.health-data-api
    version: 1.0.0-ballot

