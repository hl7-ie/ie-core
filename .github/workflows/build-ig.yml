name: Build IE Core FHIR IG

# Builds and deploys the IG from main. Pull requests are gated by pr-validation.yml.
# Actions are pinned to commit SHAs (Dependabot keeps them current); tools are pinned to exact versions and
# the downloaded jars are checked against their SHA-256. Only the deploy job can write (Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SUSHI_VERSION: 3.18.0
  PUBLISHER_VERSION: 2.3.4
  PUBLISHER_SHA256: 970922c12eb583bfb4cb6121584b922a236d5904e36413e3545d2fbc248f8e2b
  VALIDATOR_VERSION: 6.10.4
  VALIDATOR_SHA256: 1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc
  JEKYLL_VERSION: 4.4.1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'

jobs:
  sushi-r4:
    name: SUSHI R4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - name: Run SUSHI (fail on any error)
        run: |
          sushi . | tee sushi.log
          grep -Eq '\b0 Errors\b' sushi.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsh-generated-r4
          path: fsh-generated/
          retention-days: 3

  tests:
    name: BDD, quality and HIQA gates
    needs: sushi-r4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsh-generated-r4
          path: fsh-generated/
      - name: FHIR packages (parent profiles for the mapping check)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
          fail-on-cache-miss: true
      - run: npm ci
        working-directory: tests
      - run: npm run test:bdd
        working-directory: tests
      - run: npm run test:quality
        working-directory: tests
      - run: python scripts/hiqa/generate_traceability.py --check
      - run: python scripts/hiqa/check_mapping_against_snapshots.py
      - run: python scripts/qa/check_ep_data_minimisation.py
      - run: python scripts/hiqa/sync_open_issues.py --check
      - run: python scripts/qa/check_page_links.py
      - name: Simplifier.net bundle (ADR-008)
        run: python scripts/simplifier/build_bundle.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simplifier-bundle
          path: build/simplifier-upload.zip
          retention-days: 90
      - name: Test dashboard
        if: always()
        run: node tests/reports/generate-dashboard.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports-r4
          path: tests/reports/
          retention-days: 30

  validator:
    name: FHIR Validator
    needs: sushi-r4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsh-generated-r4
          path: fsh-generated/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Download validator ${{ env.VALIDATOR_VERSION }}
        run: |
          curl -fsSL -o tests/validator/validator_cli.jar "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
          echo "${VALIDATOR_SHA256}  tests/validator/validator_cli.jar" | sha256sum -c -
      - run: npm ci
        working-directory: tests
      - run: node validator/run-validation.js --tx
        working-directory: tests
      - name: Whole-IG validator QA not above baseline
        run: |
          python scripts/qa/validate_all.py . tests/validator/validator_cli.jar qa.json
          python scripts/qa/qa_gate.py qa.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-report-r4
          path: |
            tests/reports/validation-results.json
            qa.json
          retention-days: 30

  ig-publish-r4:
    name: IG Publisher R4
    needs: [tests, validator]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v "${JEKYLL_VERSION}" --no-document
      - run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Download IG Publisher ${{ env.PUBLISHER_VERSION }}
        run: |
          mkdir -p input-cache
          curl -fsSL -o input-cache/publisher.jar "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          echo "${PUBLISHER_SHA256}  input-cache/publisher.jar" | sha256sum -c -
      - run: java -Xmx6g -Dfile.encoding=UTF-8 -jar input-cache/publisher.jar -ig .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ig-output-r4
          path: output/
          retention-days: 30

  # Frozen exploratory track (ADR-005): built for continuity, never a gate.
  ig-publish-r5:
    name: IG Publisher R5 (frozen, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v "${JEKYLL_VERSION}" --no-document
      - run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - name: Download IG Publisher ${{ env.PUBLISHER_VERSION }}
        run: |
          mkdir -p r5/input-cache
          curl -fsSL -o r5/input-cache/publisher.jar "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          echo "${PUBLISHER_SHA256}  r5/input-cache/publisher.jar" | sha256sum -c -
      - run: java -Xmx6g -Dfile.encoding=UTF-8 -jar input-cache/publisher.jar -ig .
        working-directory: r5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ig-output-r5
          path: r5/output/
          retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [ig-publish-r4, ig-publish-r5, tests, validator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ig-output-r4
          path: site/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ig-output-r5
          path: site/R5/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: test-reports-r4
          path: tests/reports/
      - name: Copy test dashboard
        run: |
          mkdir -p site/test-reports
          cp tests/reports/html/index.html site/test-reports/index.html 2>/dev/null || true
          cp tests/reports/cucumber-report.html site/test-reports/r4-bdd.html 2>/dev/null || true
      - name: Version index page
        run: |
          cat > site/versions.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>IE Core FHIR IG versions</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
              table { border-collapse: collapse; width: 100%; margin-top: 20px; }
              th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
              .note { background: #fff3cd; padding: 12px; border-left: 4px solid #ffc107; }
            </style>
          </head>
          <body>
            <h1>IE (Ireland) Core FHIR Implementation Guide</h1>
            <p class="note"><strong>Proof of concept</strong> by Nithin Mohan. Not affiliated with, or endorsed by,
              HL7 Ireland, HIQA, the HSE or the Department of Health. Draft; not for clinical use.</p>
            <table>
              <tr><th>Edition</th><th>FHIR</th><th>Package</th><th>Status</th><th>Link</th></tr>
              <tr><td><strong>R4</strong></td><td>4.0.1</td><td><code>nostalgic-ie.fhir.core</code></td>
                <td>Draft, aligned with the HIQA draft national standards (Sept 2026)</td><td><a href="index.html">R4 IG</a></td></tr>
              <tr><td><strong>R5</strong></td><td>5.0.0</td><td><code>nostalgic-ie.fhir.core.r5</code></td>
                <td>Frozen exploratory track (ADR-005); not maintained</td><td><a href="R5/index.html">R5 IG</a></td></tr>
            </table>
            <p><a href="test-reports/index.html">Test report dashboard</a></p>
          </body>
          </html>
          HTMLEOF
      - run: node scripts/generate-canonical-redirects.mjs site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
