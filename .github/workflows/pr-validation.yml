name: PR Validation

# Quality gates for every pull request (Phase 9 of the HIQA 2026 alignment).
# Actions are pinned to commit SHAs (Dependabot keeps them current); tools are pinned to exact versions and
# the downloaded jars are checked against their SHA-256. Every job has read-only permissions unless it says otherwise.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  SUSHI_VERSION: 3.18.0
  PUBLISHER_VERSION: 2.3.4
  PUBLISHER_SHA256: 970922c12eb583bfb4cb6121584b922a236d5904e36413e3545d2fbc248f8e2b
  VALIDATOR_VERSION: 6.10.4
  VALIDATOR_SHA256: 1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc
  JEKYLL_VERSION: 4.4.1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'

jobs:
  sushi-r4:
    name: SUSHI R4 (0 errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Install SUSHI ${{ env.SUSHI_VERSION }}
        run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - name: Run SUSHI (fail on any error)
        run: |
          sushi . | tee sushi.log
          grep -Eq '\b0 Errors\b' sushi.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsh-generated-r4
          path: fsh-generated/
          retention-days: 3

  tests:
    name: BDD, quality, HIQA traceability and data-minimisation guard
    needs: sushi-r4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsh-generated-r4
          path: fsh-generated/
      - run: npm ci
      - name: BDD (includes the traceability and guard scripts)
        run: npm run test:bdd
      - name: Quality checks
        run: npm run test:quality
      - name: HIQA traceability matrix is current
        working-directory: .
        run: python scripts/hiqa/generate_traceability.py --check
      - name: HIQA mapping agrees with the profiles
        working-directory: .
        run: python scripts/hiqa/check_mapping_against_snapshots.py
      - name: ePrescription data-minimisation guard
        working-directory: .
        run: python scripts/qa/check_ep_data_minimisation.py
      - name: Open-issues page is in sync
        working-directory: .
        run: python scripts/hiqa/sync_open_issues.py --check
      - name: Page links resolve to artefacts
        working-directory: .
        run: python scripts/qa/check_page_links.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-reports-r4
          path: tests/reports/
          retention-days: 7

  terminology:
    name: Every explicit code exists and is active (tx.fhir.org)
    needs: sushi-r4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify codes (ADR-007)
        run: |
          python scripts/terminology/verify_codes.py | tee verify.log
          grep -Eq ' 0 not found, errored or inactive$' verify.log

  validator:
    name: FHIR Validator (examples pass; QA not above baseline)
    needs: sushi-r4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsh-generated-r4
          path: fsh-generated/
      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Cache validator ${{ env.VALIDATOR_VERSION }}
        id: validator-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/validator/validator_cli.jar
          key: validator-${{ env.VALIDATOR_VERSION }}
      - name: Download validator ${{ env.VALIDATOR_VERSION }}
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o tests/validator/validator_cli.jar "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
      - name: Check validator checksum
        run: echo "${VALIDATOR_SHA256}  tests/validator/validator_cli.jar" | sha256sum -c -
      - run: npm ci
        working-directory: tests
      - name: Validate every example (codes checked on tx.fhir.org)
        working-directory: tests
        run: node validator/run-validation.js --tx
      - name: Whole-IG validator QA not above baseline
        run: |
          python scripts/qa/validate_all.py . tests/validator/validator_cli.jar qa.json
          python scripts/qa/qa_gate.py qa.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-report-r4
          path: |
            tests/reports/validation-results.json
            qa.json
          retention-days: 7

  ig-publisher:
    name: IG Publisher R4 (QA report)
    needs: sushi-r4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.3'
      - name: Install Jekyll ${{ env.JEKYLL_VERSION }}
        run: gem install jekyll -v "${JEKYLL_VERSION}" --no-document
      - name: Install SUSHI ${{ env.SUSHI_VERSION }}
        run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
      - name: Download IG Publisher ${{ env.PUBLISHER_VERSION }}
        run: |
          mkdir -p input-cache
          curl -fsSL -o input-cache/publisher.jar "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          echo "${PUBLISHER_SHA256}  input-cache/publisher.jar" | sha256sum -c -
      - name: Run IG Publisher
        run: java -Xmx6g -Dfile.encoding=UTF-8 -jar input-cache/publisher.jar -ig .
      - name: QA summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = 'output/qa.json'
          if not os.path.exists(p):
              print('## IG Publisher QA\n\nNo qa.json produced.')
          else:
              d = json.load(open(p, encoding='utf-8'))
              print('## IG Publisher QA\n')
              print(f"- Errors: {d.get('errs')}\n- Warnings: {d.get('warnings')}\n- Hints: {d.get('hints')}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ig-qa-r4
          path: |
            output/qa.html
            output/qa.json
            output/qa.txt
          retention-days: 7

  sushi-r5:
    name: SUSHI R5 (informational; frozen track, ADR-005)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g fsh-sushi@${{ env.SUSHI_VERSION }}
      - run: sushi r5/

  pr-comment:
    name: Post PR test summary
    needs: [tests, validator]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: test-reports-r4
          path: tests/reports/
      - name: Generate PR summary
        run: node tests/reports/generate-summary.js tests/reports/pr-comment.md
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: tests/reports/pr-comment.md
          header: ie-core-test-results
